global(workDirectory="/var/spool/rsyslog")

module(load="imudp")
module(load="imtcp")
module(load="ommysql")

template(
  name="SystemEventsInsert"
  type="list"
  option.sql="on"
) {
  constant(value="INSERT INTO SystemEvents (ReceivedAt, DeviceReportedTime, Facility, Priority, FromHost, SysLogTag, Messagetype, processid, Message) VALUES ('")
  property(name="timegenerated" dateFormat="mysql")
  constant(value="','")
  property(name="timereported" dateFormat="mysql")
  constant(value="',")
  property(name="syslogfacility")
  constant(value=",")
  property(name="syslogseverity")
  constant(value=",'")
  property(name="hostname")
  constant(value="','")
  property(name="syslogtag")
  constant(value="','")
  property(name="syslogtag")
  constant(value="',0,'")
  property(name="msg")
  constant(value="')")
}

ruleset(name="remote_to_mysql") {
  *.* action(
    type="ommysql"
    server="db"
    serverport="3306"
    db="rsyslogdb"
    uid="rsyslog"
    pwd="rsyslog"
    template="SystemEventsInsert"
  )
}

input(type="imudp" port="5514" ruleset="remote_to_mysql")
input(type="imtcp" port="5514" ruleset="remote_to_mysql")
